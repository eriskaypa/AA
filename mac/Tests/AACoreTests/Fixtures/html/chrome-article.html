<meta charset='utf-8'><h2 style="color: rgb(32, 33, 36); font-family: Arial, sans-serif; font-size: 20px; font-weight: 400;">Ballast water <em>record book</em></h2>
<p style="color: rgb(32, 33, 36); font-family: Arial, sans-serif; font-size: 14px; text-align: justify;">Every ship of 400 GT and above shall carry a <a href="https://www.imo.org/en/OurWork/Environment/Pages/BallastWaterManagement.aspx" style="color: rgb(26, 13, 171);">Ballast Water Record Book</a>, either electronic or paper.&nbsp; Entries are signed by the officer in charge.</p>
<ul style="color: rgb(32, 33, 36);"><li>Uptake</li><li>Discharge <strong>to reception facility</strong></li></ul>
